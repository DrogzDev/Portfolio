@if (links().length) {
  <div class="project-links">
    @for (link of links(); track link.url) {
      <a [href]="link.url" target="_blank" rel="noreferrer">
        {{ link.label }} <span aria-hidden="true">↗</span>
      </a>
    }
  </div>
} @else if (linksNote()) {
  <p class="project-links-note">{{ linksNote() }}</p>
}
